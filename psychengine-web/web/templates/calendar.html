{% extends "base.html" %}
{% block title %}Calendar{% endblock %}
{% block content %}

<div class="page-header">
  <div>
    <h1 class="page-title">Calendar</h1>
    <div class="page-subtitle">Study activity over the last 6 months.</div>
  </div>
</div>

<div class="card">
  <div style="display: grid; grid-template-columns: repeat({{ (cells|length / 7)|round(0,'ceil')|int }}, 1fr); gap: 3px;">
    {% for c in cells %}
      {% set lvl = (c.n // 3)|int %}
      <div title="{{ c.date }} — {{ c.n }} activities" style="aspect-ratio: 1; border-radius: 3px; background: {{ ['var(--surface-hover)', 'rgba(52,211,153,0.25)', 'rgba(52,211,153,0.55)', 'rgba(52,211,153,0.85)', 'var(--color-success)'][lvl if lvl < 5 else 4] }};"></div>
    {% endfor %}
  </div>
  <div class="row gap-3 mt-5 text-sm text-tertiary">
    <span>less</span>
    <div style="width: 14px; height: 14px; background: var(--surface-hover); border-radius: 3px;"></div>
    <div style="width: 14px; height: 14px; background: rgba(52,211,153,0.25); border-radius: 3px;"></div>
    <div style="width: 14px; height: 14px; background: rgba(52,211,153,0.55); border-radius: 3px;"></div>
    <div style="width: 14px; height: 14px; background: rgba(52,211,153,0.85); border-radius: 3px;"></div>
    <div style="width: 14px; height: 14px; background: var(--color-success); border-radius: 3px;"></div>
    <span>more</span>
  </div>
</div>
{% endblock %}
